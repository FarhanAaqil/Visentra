name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check backend scripts tests

      - name: Ruff format
        run: ruff format --check backend scripts tests

      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Boot the API, let it seed, and walk every pillar
        env:
          STORAGE_ROOT: ${{ runner.temp }}/storage
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/e2e.db
          CASCADE_DELAY_S: "0"
        run: |
          uvicorn backend.main:app --port 8000 > api.log 2>&1 &
          python scripts/smoke_check.py || (cat api.log; exit 1)

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -f backend/Dockerfile -t visentra-api .
      - name: Frontend image
        run: docker build -t visentra-ui frontend

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

[project]
name = "visentra"
version = "1.0.0"
description = "Cryptographic provenance and behavioural assurance for computer vision supply chains"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["backend/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning:imagehash.*"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/db/migrations/*"]
